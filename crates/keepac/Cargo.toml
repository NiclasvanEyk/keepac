[package]
name = "keepac"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
tempdir = "0.3.7"
pulldown-cmark = "0.12.2"

[build-dependencies]
cc = "*"

[dependencies]
pulldown-cmark = "0.12.2"
streaming-iterator = "0.1"
termcolor = "1.4.1"
termimad = "0.31"
textwrap = { version = "0.16", features = ["terminal_size"] }
thiserror = "2.0"
tree-sitter = "0.24"
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", branch = "split_parser", version = "0.4.0", features = ["parser"] }
